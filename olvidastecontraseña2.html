<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar código</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/olvidastecontraseña2.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header class="header-brand">
        <img src="assets/images/logo-sena-verde-complementario-svg-2022.svg" alt="Logo SENA" class="logo-sena">
        <h2 class="title-brand">AVISENA COL</h2>
    </header>

    <main class="main-card">
        <h1 class="title-recover">Recuperación <br> de contraseña</h1>
        <p class="text-instruction">
            Por favor ingresa el código de 6 dígitos enviado al correo electrónico
            que tienes registrado en el aplicativo.
        </p>

        <form id="recoverForm" class="form-container">
            <input id="code" type="text" maxlength="6" placeholder="Código de verificación">
            <span id="errorMsg">Debes ingresar un código válido de 6 dígitos</span>
            <button id="submitBtn" type="submit" class="btn-submit">ENVIAR</button>
        </form>
    </main>

    <a href="index.html" class="btn-salir">SALIR</a>

    <script src="assets/js/contraseña2.js"></script>
</body>
</html>
