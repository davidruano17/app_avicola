<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión - AVISENA COL</title>
    <link rel="stylesheet" href="assets/css/iniciosesion.css">
</head>
<body>

    <header class="top-nav">
        <section class="logo-area">
            <img src="assets/images/logo-sena-verde-complementario-svg-2022.svg" alt="Logo SENA">
            <h2>AVISENA COL</h2>
        </section>
        <p>Sistema de Gestión Avícola</p>
    </header>

    <main class="login-container">
        <article class="login-card">
            <header class="card-header">
                <h1>Bienvenido</h1>
                <p>Gestiona tu producción en <span>AVISENA COL</span>.</p>
            </header>

            <form class="login-form">
                <section class="field">
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="ejemplo@misena.edu.co">
                </section>

                <section class="field">
                    <label>Contraseña</label>
                    <input id="password" type="password" placeholder="••••••••">
                    <button type="button" class="eye-btn" onclick="togglePassword()">👁</button>
                </section>

                <a href="menucolapsable.html" class="btn-primary">INICIAR SESIÓN</a>

                <section class="separator">
                    <span>o</span>
                </section>

                <section class="social-btns">
                    <button type="button" class="btn-social">Google</button>
                    <button type="button" class="btn-social">Facebook</button>
                </section>
            </form>

            <footer class="card-footer">
                <a href="olvidastecontraseña.html">¿olvidaste tu contraseña?</a>
            </footer>
        </article>
    </main>

    <footer class="main-footer">
        <p>© 2026 AVISENA COL - SENA. Innovación y Sostenibilidad Avícola.</p>
    </footer>

    <script src="assets/js/iniciosesion.js"></script>
</body>
</html>
