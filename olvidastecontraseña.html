<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperación de Contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/olvidastecontraseña1.css">
</head>
<body>

  <main class="main-content">
    <img src="assets/images/logo-sena-verde-complementario-svg-2022.svg" alt="Logo SENA" class="logo-sena">

    <button onclick="window.location.href='index.html'" class="btn-salir" type="button">
      SALIR
    </button>

    <section class="card">
      <h1>Recuperación <br> de contraseña</h1>
      <p class="desc">Por favor ingresa el correo electrónico <br> que tienes registrado en el aplicativo.</p>

      <form id="recoverForm" class="form-group">
        <input id="email" type="email" placeholder="Correo electronico">
        <button type="submit" class="btn-enviar">ENVIAR</button>
        <p id="errorMsg" style="display:none; color: red; font-weight: bold; font-size: 0.8rem;">Ingresa un correo válido.</p>
        <p id="successMsg" style="display:none; color: green; font-weight: bold; font-size: 0.8rem;">Código enviado correctamente.</p>
      </form>

      <article class="info-box">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828640.png" alt="icono info">
        <p class="info-text">Se enviará un código a tu correo electrónico, para cambiar la contraseña.</p>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/contraseña1.js"></script>
</body>
</html>
