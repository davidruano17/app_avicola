<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/olvidastecontraseña3.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header class="header-brand">
        <img src="assets/images/logo-sena-verde-complementario-svg-2022.svg" alt="Logo SENA" class="logo-sena">
        <h2 class="title-brand">AVISENA COL</h2>
    </header>

    <main class="main-card">
        <h1 class="title-reset">Restablecer <br> contraseña</h1>

        <form id="resetForm" class="form-container">
            <input id="newPass" type="password" placeholder="Contraseña nueva" class="input-pass">
            <input id="confirmPass" type="password" placeholder="Confirmación de contraseña" class="input-pass">
            <button id="submitBtn" type="submit" class="btn-confirm">CONFIRMAR CAMBIO</button>
        </form>
    </main>

    <a href="index.html" class="btn-salir">SALIR</a>

    <script src="assets/js/contraseña3.js"></script>
</body>
</html>
