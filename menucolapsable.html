<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Instructor Líder - Granja Digital</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#5be830",
                        "background-light": "#f6f8f6",
                        "background-dark": "#152111",
                    },
                    fontFamily: { display: ["Inter", "sans-serif"] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .sidebar-transition {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Anchos controlados */
        #sidebar { width: 288px; } /* w-72 */

        /* Clase para el estado colapsado */
        .is-collapsed {
            width: 75px !important;
        }

        /* Hover para expandir temporalmente */
        .is-collapsed:hover {
            width: 288px !important;
            box-shadow: 10px 0 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 50;
        }

        /* Ocultar textos cuando esté colapsado y no haya hover */
        .is-collapsed:not(:hover) .nav-text, 
        .is-collapsed:not(:hover) .logo-text,
        .is-collapsed:not(:hover) .user-info-text {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        /* Animación suave para los textos */
        .nav-text, .logo-text {
            transition: opacity 0.2s ease-in-out;
            white-space: nowrap;
        }

        /* Centrar iconos en estado pequeño */
        .is-collapsed:not(:hover) .nav-link {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">

    <section class="flex h-screen w-full overflow-hidden">

        <aside id="sidebar" class="sidebar-transition bg-white dark:bg-zinc-900 border-r border-slate-200 dark:border-zinc-800 flex flex-col justify-between shrink-0 relative">
            
            <section class="flex flex-col gap-8 p-4">
                <button id="toggleSidebar" class="absolute -right-3 top-9 bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 p-1.5 rounded-full shadow-md z-[100] hover:scale-110 transition-transform">
                    <i data-lucide="lock" id="toggleIcon" class="w-3.5 h-3.5 text-primary"></i>
                </button>

                <header class="flex items-center gap-3 px-2 overflow-hidden">
                    <div class="p-2 bg-primary/10 rounded-xl flex items-center justify-center shrink-0">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/SENA_logo.svg" class="w-8 h-8" alt="SENA">
                    </div>
                    <div class="logo-text leading-none transition-all duration-300">
                        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white uppercase leading-none">
                            AVISENA
                        </h1>
                        <p class="text-xs font-semibold text-primary mt-1 uppercase tracking-wider">
                            INSTRUCTOR LÍDER
                        </p>
                    </div>
                </header>

                <nav class="flex flex-col gap-1">
                    <a href="#" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                        <i data-lucide="user" class="w-5 h-5 shrink-0"></i>
                        <span class="nav-text text-sm font-medium">Perfil</span>
                    </a>
                    <a href="#" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                        <i data-lucide="bell" class="w-5 h-5 shrink-0"></i>
                        <span class="nav-text text-sm font-medium">Notificaciones</span>
                    </a>
                    <a href="#" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                        <i data-lucide="users-2" class="w-5 h-5 shrink-0"></i>
                        <span class="nav-text text-sm font-medium">Gestión de Usuarios</span>
                    </a>
                    <a href="#" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                        <i data-lucide="file-text" class="w-5 h-5 shrink-0"></i>
                        <span class="nav-text text-sm font-medium">Reportes</span>
                    </a>
                    <a href="#" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                        <i data-lucide="clipboard-list" class="w-5 h-5 shrink-0"></i>
                        <span class="nav-text text-sm font-medium">Registros</span>
                    </a>
                    <a href="#" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
                        <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
                        <span class="nav-text text-sm font-medium">Ajustes</span>
                    </a>
                </nav>
            </section>

            <footer class="p-4 border-t border-slate-200 dark:border-zinc-800">
                <button class="nav-link flex items-center gap-4 w-full px-4 py-2.5 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5 shrink-0"></i>
                    <span class="nav-text text-sm font-bold">Cerrar Sesión</span>
                </button>
            </footer>

        </aside>

        <main class="flex-1 flex flex-col overflow-y-auto bg-background-light dark:bg-background-dark">

            <header class="flex items-center justify-between px-8 py-4 bg-white dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800 sticky top-0 z-10">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Panel de Control General</h2>
                
                <section class="flex items-center gap-6">
                    <section class="relative hidden lg:block w-72">
                        <input id="buscador" type="text" placeholder="Buscar..."
                            class="w-full px-4 py-2 bg-slate-100 dark:bg-zinc-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary" />
                    </section>

                    <section class="flex items-center gap-3">
                        <section class="user-info-text text-right transition-all">
                            <p class="text-sm font-bold text-slate-900 dark:text-white leading-none">Carlos Instructor</p>
                            <p class="text-[10px] font-bold text-primary uppercase">Online</p>
                        </section>
                        <section class="w-10 h-10 rounded-full bg-slate-200 border-2 border-primary overflow-hidden">
                            <img src="https://ui-avatars.com/api/?name=Carlos+Instructor&background=5be830&color=fff" alt="Profile" class="w-full h-full object-cover">
                        </section>
                    </section>
                </section>
            </header>

            <section class="p-8 max-w-7xl mx-auto w-full flex flex-col gap-8">
                <header class="flex flex-col gap-2">
                    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">Bienvenido, Instructor Líder</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-lg">Resumen general de la actividad.</p>
                </header>
                
                <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <article class="bg-white dark:bg-zinc-900 p-6 rounded-xl border border-slate-200 dark:border-zinc-800 shadow-sm">
                        <p class="text-slate-500 font-medium mb-2">Usuarios Activos</p>
                        <section class="flex items-end justify-between">
                            <p class="text-3xl font-bold text-slate-900 dark:text-white">124</p>
                            <p class="text-sm font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded">+12%</p>
                        </section>
                    </article>
                    </section>
            </section>
        </main>

    </section>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleSidebar');
        const toggleIcon = document.getElementById('toggleIcon');

        // Lógica del botón de candado
        toggleBtn.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.toggle('is-collapsed');
            
            if (isCollapsed) {
                toggleIcon.setAttribute('data-lucide', 'lock-keyhole-open'); // Candado abierto
                toggleIcon.classList.replace('text-primary', 'text-slate-400');
            } else {
                toggleIcon.setAttribute('data-lucide', 'lock'); // Candado cerrado
                toggleIcon.classList.replace('text-slate-400', 'text-primary');
            }
            
            // Refrescar iconos para que cambie el candado
            lucide.createIcons();
        });
    </script>

</body>
</html>
