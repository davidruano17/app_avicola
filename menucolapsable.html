<!DOCTYPE html>
<html lang="es" class="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVISENA Pro - Dashboard Estático</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#5be830", "background-light": "#f6f8f6" },
                    fontFamily: { display: ["Inter", "sans-serif"] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .sidebar-transition { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar { width: 288px; z-index: 40; }
        .is-collapsed { width: 75px !important; }
        .is-collapsed:hover { width: 288px !important; box-shadow: 10px 0 15px rgba(0,0,0,0.1); }

        /* Visibilidad de elementos */
        .nav-text, .logo-text, .user-info-text, .chevron-icon { transition: opacity 0.2s; white-space: nowrap; }
        .is-collapsed:not(:hover) .nav-text, 
        .is-collapsed:not(:hover) .logo-text,
        .is-collapsed:not(:hover) .user-info-text,
        .is-collapsed:not(:hover) .chevron-icon,
        .is-collapsed:not(:hover) .submenu { display: none; opacity: 0; }

        .is-collapsed:not(:hover) .nav-link { justify-content: center; padding-left: 0; padding-right: 0; }

        /* Dropdowns */
        .submenu { display: none; flex-direction: column; gap: 0.5rem; padding-left: 3rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .submenu.active { display: flex; }
        .rotate-180 { transform: rotate(180deg); }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="bg-background-light text-slate-900">

    <div class="flex h-screen w-full overflow-hidden">

        <aside id="sidebar" class="sidebar-transition bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 relative shadow-sm">
            
            <section class="flex flex-col gap-8 p-4 overflow-y-auto">
                <button id="toggleSidebar" class="absolute -right-3 top-9 bg-white border border-slate-200 p-1.5 rounded-full shadow-md z-[100] hover:scale-110">
                    <i data-lucide="lock" id="toggleIcon" class="w-3.5 h-3.5 text-primary"></i>
                </button>

                <header class="flex items-center gap-3 px-2">
                    <div class="p-2 bg-primary/10 rounded-xl shrink-0">
                        <img src="assets/images/logo-sena-verde-complementario-svg-2022.svg" class="w-8 h-8" alt="SENA">
                    </div>
                    <div class="logo-text">
                        <h1 class="text-xl font-extrabold uppercase leading-none">AVISENA</h1>
                        <p class="text-[10px] font-bold text-primary mt-1 uppercase tracking-tighter">Instructor Líder</p>
                    </div>
                </header>

                <nav class="flex flex-col gap-1">
                    <button onclick="navigateTo('opcionperfil.html')" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span class="nav-text text-sm font-medium">Perfil</span>
                    </button>

                    <button onclick="navigateTo('notificaciones.html')" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span class="nav-text text-sm font-medium">Notificaciones</span>
                    </button>

                    <button onclick="navigateTo('gestionusuarios.html')" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
                        <i data-lucide="users-2" class="w-5 h-5"></i>
                        <span class="nav-text text-sm font-medium">Gestión de Usuarios</span>
                    </button>

                    <div>
                        <button onclick="toggleDropdown('menu-reportes', 'icon-reportes')" class="nav-link w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                            <span class="nav-text text-sm font-medium flex-1 text-left">Reportes</span>
                            <i data-lucide="chevron-down" id="icon-reportes" class="chevron-icon w-4 h-4 transition-transform"></i>
                        </button>
                        <div id="menu-reportes" class="submenu">
                            <button onclick="navigateTo('rep_diario.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Producción Diaria</button>
                            <button onclick="navigateTo('rep_alimento.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Consumo Alimento</button>
                            <button onclick="navigateTo('rep_mortalidad.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Mortalidad Aves</button>
                            <button onclick="navigateTo('rep_finanzas.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Finanzas Granja</button>
                        </div>
                    </div>

                    <div>
                        <button onclick="toggleDropdown('menu-registros', 'icon-registros')" class="nav-link w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
                            <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                            <span class="nav-text text-sm font-medium flex-1 text-left">Registros</span>
                            <i data-lucide="chevron-down" id="icon-registros" class="chevron-icon w-4 h-4 transition-transform"></i>
                        </button>
                        <div id="menu-registros" class="submenu">
                            <button onclick="navigateTo('registros.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Ingreso de Aves</button>
                            <button onclick="navigateTo('reg_vacunas.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Vacunación</button>
                            <button onclick="navigateTo('reg_limpieza.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Limpieza Galpones</button>
                            <button onclick="navigateTo('reg_salida.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Salida Producto</button>
                            <button onclick="navigateTo('reg_mant.html')" class="text-xs font-medium text-slate-500 hover:text-primary text-left">Mantenimiento</button>
                        </div>
                    </div>

                    <button onclick="navigateTo('ajustes.html')" class="nav-link flex items-center gap-4 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                        <span class="nav-text text-sm font-medium">Ajustes</span>
                    </button>
                </nav>
            </section>

            <footer class="p-4 border-t border-slate-100">
                <button class="flex items-center gap-4 w-full px-4 py-2.5 text-red-500 hover:bg-red-50 rounded-lg font-bold text-sm">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="nav-text">Cerrar Sesión</span>
                </button>
            </footer>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-background-light overflow-hidden">
            <header class="flex items-center justify-between px-8 py-4 bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                <h2 class="text-xl font-bold text-slate-900" id="page-title">Cargando...</h2>
                <div class="flex items-center gap-3">
                    <div class="user-info-text text-right">
                        <p class="text-sm font-bold leading-none"> Instructor lider</p>
                        <p class="text-[10px] font-bold text-primary uppercase mt-1">Online</p>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=lider+Instructor&background=5be830&color=fff" class="w-10 h-10 rounded-full border-2 border-primary" alt="Perfil">
                </div>
            </header>

            <section id="main-view" class="flex-1 overflow-y-auto p-8 fade-in">
                </section>
        </main>
    </div>

    <script>
        async function navigateTo(fileUrl) {
    const container = document.getElementById('main-view');
    const titleElement = document.getElementById('page-title');
    
    try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error("No se pudo encontrar el archivo " + fileUrl);
        
        const html = await response.text();
        container.innerHTML = html;

        // --- NUEVA LÓGICA PARA SCRIPTS ---
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            if (oldScript.src) {
                // Si el script tiene un src (archivo externo)
                newScript.src = oldScript.src;
            } else {
                // Si el script es código interno
                newScript.textContent = oldScript.textContent;
            }
            document.body.appendChild(newScript).parentNode.removeChild(newScript);
        });
        // ---------------------------------

        const cleanTitle = fileUrl.replace('.html', '').replace('_', ' ').toUpperCase();
        titleElement.innerText = cleanTitle;
        lucide.createIcons();

    } catch (error) {
        // ... manejo de error
        console.error("Error al navegar a:", fileUrl, error);
    }
}

        // --- LÓGICA DEL SIDEBAR ---
        const sidebar = document.getElementById('sidebar');
        const toggleIcon = document.getElementById('toggleIcon');
        
        document.getElementById('toggleSidebar').addEventListener('click', () => {
            const isCollapsed = sidebar.classList.toggle('is-collapsed');
            toggleIcon.setAttribute('data-lucide', isCollapsed ? 'lock-keyhole-open' : 'lock');
            lucide.createIcons();
        });

        function toggleDropdown(mId, iId) {
            document.getElementById(mId).classList.toggle('active');
            document.getElementById(iId).classList.toggle('rotate-180');
        }

        // --- CARGA INICIAL (Siempre en Perfil) ---
        window.onload = () => {
            navigateTo('opcionperfil.html');
            lucide.createIcons();
        };
    </script>
</body>
</html>
